version: 2

models:
  - name: mart_zone_revenue
    description: >
      Monthly revenue generated by pickup zone. Used to analyse
      revenue trends and identify the highest revenue generating
      pickup zones across NYC.

  - name: mart_tip_behaviour
    description: >
      Analyses tipping behaviour by payment type, trip distance,
      and pickup zone.

  - name: mart_demand_timing
    description: >
      Summarises hourly taxi demand and average fare to identify
      peak and off-peak travel periods.