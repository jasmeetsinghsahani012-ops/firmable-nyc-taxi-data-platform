version: 2

sources:
  - name: raw
    database: FIRMABLE_TAXI_DB
    schema: RAW

    config:
      freshness:
        warn_after:
          count: 1
          period: day
        error_after:
          count: 2
          period: day

    tables:
      - name: YELLOW_TAXI_TRIPS_2023
        description: Raw Yellow Taxi trip records loaded from NYC TLC Parquet files.
        config:
          loaded_at_field: loaded_at

      - name: TAXI_ZONE_LOOKUP
        description: Taxi zone lookup reference table.
        config:
          loaded_at_field: loaded_at