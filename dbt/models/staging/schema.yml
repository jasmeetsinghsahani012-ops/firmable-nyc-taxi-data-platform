version: 2

models:
  - name: stg_yellow_taxi_trips
    description: Clean staging view for Yellow Taxi trip records.

    columns:
      - name: vendor_id
        tests:
          - not_null

      - name: tpep_pickup_datetime
        tests:
          - not_null

      - name: tpep_dropoff_datetime
        tests:
          - not_null

      - name: pu_location_id
        tests:
          - not_null

      - name: do_location_id
        tests:
          - not_null

  - name: stg_taxi_zone_lookup
    description: Clean staging view for taxi zones.

    columns:
      - name: location_id
        tests:
          - unique
          - not_null